[project]
name = "contacts-api-python"
version = "0.1.0"
description = "Contacts API"
readme = "README.md"
authors = [
    { name = "CarlosAMolina", email = "15368012+CarlosAMolina@users.noreply.github.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "fastapi[standard]==0.162.0",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.fastapi]
entrypoint = "contacts_api_python.main:app"

[tool.mypy]
check_untyped_defs = true

[tool.ruff.lint.isort]
force-single-line = true

[tool.uv]
add-bounds = "exact"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
